services:
  web:
    build: .
    ports:
      - "13000:3000"
    volumes:
      - .:/app
      - msw_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules
            - .git
        - action: rebuild
          path: package.json
volumes:
  msw_node_modules:
